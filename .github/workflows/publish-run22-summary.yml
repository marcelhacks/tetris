name: Publish sanitized Firefox run 22 result

on:
  push:
    branches: [runner-probe-20260910]
    paths:
      - .github/workflows/publish-run22-summary.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runner-probe-20260910
      - name: Download run 22 public result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf downloaded
          mkdir downloaded
          gh run download 34521065864 --repo "$GITHUB_REPOSITORY" --name sealed-firefox-e2e-windows --dir downloaded
          test -f downloaded/public-summary.json
          mkdir -p .proof-results
          cp downloaded/public-summary.json .proof-results/run22-public-summary.json
      - name: Commit sanitized result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .proof-results/run22-public-summary.json
          git commit -m "Publish Firefox run 22 sanitized result" || exit 0
          git push origin HEAD:runner-probe-20260910
