name: Firefox JIT unsafe ABI audit

on:
  push:
    branches:
      - chatgpt-firefox-audit2-20260910

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch current Firefox JavaScript engine sources
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --filter=blob:none --sparse https://github.com/mozilla-firefox/firefox.git firefox
          cd firefox
          git sparse-checkout set js/src
          git rev-parse HEAD | tee ../firefox-revision.txt

      - name: Analyze unsafe ABI and hidden script-entry paths
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('firefox/js/src')
          suffixes = {'.cpp', '.h', '.inl'}
          files = [p for p in root.rglob('*') if p.is_file() and
                   (p.suffix in suffixes or p.name.endswith('-inl.h'))]

          danger_re = re.compile(
              r'\b(?:Call|Invoke|GetProperty|GetOwnProperty|GetElement|HasProperty|'
              r'LookupProperty|PromiseResolve|NewPromiseObject|IterableToArray|'
              r'GetIterator|ToPrimitive|ToString|ToNumber|JS_CallFunction|'
              r'JS_GetProperty|CallGetter|CallSetter|RunJobs|DrainJobQueue)\b')
          unsafe_re = re.compile(r'\bAutoUnsafeCallWithABI\b')

          def function_span(lines, hit):
              # Find a plausible function opening brace before the hit.
              start = hit
              while start >= 0:
                  line = lines[start]
                  if '{' in line and not line.lstrip().startswith(('#', '//')):
                      prefix = '\n'.join(lines[max(0, start-8):start+1])
                      if re.search(r'[\w:~<>*&]\s+[\w:~<>]+\s*\([^;]*\)\s*(?:const\s*)?\{\s*$', prefix, re.S):
                          break
                  start -= 1
              if start < 0:
                  return max(0, hit-10), min(len(lines), hit+20)
              depth = 0
              seen = False
              end = start
              while end < len(lines):
                  for ch in lines[end]:
                      if ch == '{':
                          depth += 1; seen = True
                      elif ch == '}':
                          depth -= 1
                  end += 1
                  if seen and depth <= 0:
                      break
              return max(0, start-8), min(len(lines), end+2)

          unsafe_out = []
          unsafe_names = set()
          for path in files:
              text = path.read_text(encoding='utf-8', errors='replace')
              if 'AutoUnsafeCallWithABI' not in text:
                  continue
              lines = text.splitlines()
              hits = [i for i, line in enumerate(lines) if unsafe_re.search(line)]
              spans = []
              for hit in hits:
                  lo, hi = function_span(lines, hit)
                  if not spans or lo > spans[-1][1]:
                      spans.append([lo, hi])
                  else:
                      spans[-1][1] = max(spans[-1][1], hi)
              rel = path.relative_to(root).as_posix()
              for lo, hi in spans:
                  body = '\n'.join(lines[lo:hi])
                  signature = next((lines[i].strip() for i in range(lo, min(hi, lo+12))
                                    if '(' in lines[i] and not lines[i].lstrip().startswith('//')), '<unknown>')
                  names = re.findall(r'([A-Za-z_][A-Za-z0-9_:~]*)\s*\(', signature)
                  if names:
                      unsafe_names.add(names[-1].split('::')[-1])
                  dangers = sorted(set(danger_re.findall(body)))
                  unsafe_out.append(f'===== {rel}:{lo+1}-{hi} =====')
                  unsafe_out.append(f'DANGEROUS_TOKENS={dangers}')
                  unsafe_out.extend(f'{n+1}: {lines[n]}' for n in range(lo, hi))
                  unsafe_out.append('')
          Path('unsafe-abi-functions.txt').write_text('\n'.join(unsafe_out), encoding='utf-8')

          # Collect direct ABI call targets from JIT and Wasm code.
          target_re = re.compile(r'callWithABI(?:<[^>]*,\s*([A-Za-z_][A-Za-z0-9_:]*)(?:\(\))?>|\s*\(\s*(?:DynamicFunction<[^>]+>\()?([A-Za-z_][A-Za-z0-9_:]*))')
          rows = []
          for path in files:
              rel = path.relative_to(root).as_posix()
              if not (rel.startswith('jit/') or rel.startswith('wasm/')):
                  continue
              lines = path.read_text(encoding='utf-8', errors='replace').splitlines()
              for i, line in enumerate(lines):
                  if 'callWithABI' not in line:
                      continue
                  window = ' '.join(lines[i:min(len(lines), i+6)])
                  for match in target_re.finditer(window):
                      target = match.group(1) or match.group(2)
                      if target:
                          rows.append((rel, i+1, target))
          Path('abi-call-targets.tsv').write_text(
              'file\tline\ttarget\n' + '\n'.join(f'{a}\t{b}\t{c}' for a,b,c in rows) + '\n',
              encoding='utf-8')

          # Find likely function definitions and print any ABI target whose body
          # contains a script-entry/property/coercion token.
          targets = {t.split('::')[-1] for _,_,t in rows}
          report = []
          for path in files:
              lines = path.read_text(encoding='utf-8', errors='replace').splitlines()
              rel = path.relative_to(root).as_posix()
              for i, line in enumerate(lines):
                  for target in targets:
                      if target not in line or '(' not in line or line.lstrip().startswith(('#','//')):
                          continue
                      if re.search(r'\b' + re.escape(target) + r'\s*\(', line) is None:
                          continue
                      lo, hi = function_span(lines, i)
                      body = '\n'.join(lines[lo:hi])
                      dangers = sorted(set(danger_re.findall(body)))
                      if not dangers:
                          continue
                      report.append(f'===== target={target} {rel}:{lo+1}-{hi} =====')
                      report.append(f'DANGEROUS_TOKENS={dangers}')
                      report.extend(f'{n+1}: {lines[n]}' for n in range(lo, hi))
                      report.append('')
          Path('abi-target-danger-bodies.txt').write_text('\n'.join(report), encoding='utf-8')

          # Focused extracts for Wasm stack switching, exception wrapping, and
          # calls that can enter script or allocate.
          focus_patterns = [
              re.compile(p, re.I) for p in [
                  r'GetOrWrapWasmException', r'WasmExceptionObject', r'WasmFindHandler',
                  r'MWasmResume', r'MWasmSuspend', r'ContBaseFrame', r'PromiseResolve',
                  r'AddPromiseReactions', r'GetPromiseResults', r'AutoUnsafeCallWithABI',
                  r'GetProperty\(', r'Call\(', r'Invoke\(', r'IterableToArray',
                  r'can run (?:JS|JavaScript)', r're-?entran', r'side[- ]effect',
              ]
          ]
          focus = []
          for path in files:
              rel = path.relative_to(root).as_posix()
              if not (rel.startswith('wasm/') or rel.startswith('jit/')):
                  continue
              lines = path.read_text(encoding='utf-8', errors='replace').splitlines()
              hits = [i for i,l in enumerate(lines) if any(p.search(l) for p in focus_patterns)]
              merged = []
              for i in hits:
                  lo, hi = max(0, i-8), min(len(lines), i+10)
                  if merged and lo <= merged[-1][1]:
                      merged[-1][1] = max(merged[-1][1], hi)
                  else:
                      merged.append([lo,hi])
              for lo,hi in merged:
                  focus.append(f'===== {rel}:{lo+1}-{hi} =====')
                  focus.extend(f'{n+1}: {lines[n]}' for n in range(lo,hi))
                  focus.append('')
          Path('wasm-jit-focused-extracts.txt').write_text('\n'.join(focus), encoding='utf-8')
          PY

      - name: Bundle exact high-risk sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p source-bundle
          while read -r file; do
            if [ -f "firefox/js/src/$file" ]; then
              mkdir -p "source-bundle/$(dirname "$file")"
              cp "firefox/js/src/$file" "source-bundle/$file"
            fi
          done <<'FILES'
          jit/MIR.h
          jit/MIR.cpp
          jit/MIR-wasm.h
          jit/MIR-wasm.cpp
          jit/MIROps.yaml
          jit/AliasAnalysis.cpp
          jit/LICM.cpp
          jit/Lowering.cpp
          jit/CodeGenerator.cpp
          jit/CacheIR.cpp
          jit/CacheIRCompiler.cpp
          jit/VMFunctions.cpp
          jit/ABIFunctionList-inl.h
          jit/LIR.h
          jit/LIR.cpp
          vm/ObjectOperations-inl.h
          vm/TypedArrayObject-inl.h
          vm/TypedArrayObject.cpp
          wasm/WasmPI.cpp
          wasm/WasmBuiltins.cpp
          wasm/WasmFrameIter.cpp
          wasm/WasmStacks.cpp
          wasm/WasmStubs.cpp
          wasm/WasmIonCompile.cpp
          wasm/WasmBaselineCompile.cpp
          wasm/WasmJS.cpp
          wasm/WasmJS.h
          wasm/WasmGcObject.cpp
          wasm/WasmGC.cpp
          FILES
          tar -czf source-bundle.tar.gz source-bundle

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-unsafe-abi-audit
          path: |
            firefox-revision.txt
            unsafe-abi-functions.txt
            abi-call-targets.tsv
            abi-target-danger-bodies.txt
            wasm-jit-focused-extracts.txt
            source-bundle.tar.gz
          if-no-files-found: warn
