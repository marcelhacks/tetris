name: Firefox JIT effect inventory

on:
  push:
    branches:
      - chatgpt-firefox-audit2-20260910

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch current Firefox JavaScript engine sources
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --filter=blob:none --sparse https://github.com/mozilla-firefox/firefox.git firefox
          cd firefox
          git sparse-checkout set js/src
          git rev-parse HEAD | tee ../firefox-revision.txt

      - name: Inventory restricted call-capable MIR nodes
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('firefox/js/src/jit/MIROps.yaml').read_text(encoding='utf-8')
          starts = list(re.finditer(r'(?m)^- name: ([A-Za-z0-9_]+)\s*$', text))
          rows = []
          restricted = []
          for i, match in enumerate(starts):
              end = starts[i + 1].start() if i + 1 < len(starts) else len(text)
              block = text[match.start():end].rstrip()
              if 'possibly_calls: true' not in block:
                  continue
              name = match.group(1)
              alias_match = re.search(r'(?m)^  alias_set:(?:[^\n]*\n(?:    [^\n]*\n?)*)?', block)
              alias = alias_match.group(0).strip().replace('\n', ' | ') if alias_match else '<default Any>'
              movable = 'movable: true' in block
              guard = 'guard: true' in block
              rows.append((name, movable, guard, alias))
              if alias_match and 'load: Any' not in alias and 'store: Any' not in alias:
                  restricted.append(block)
          summary = 'name\tmovable\tguard\talias\n' + '\n'.join(
              '\t'.join(map(str, row)) for row in rows
          ) + '\n'
          Path('mir-call-summary.tsv').write_text(summary, encoding='utf-8')
          Path('mir-restricted-call-blocks.txt').write_text(
              ('\n\n' + '=' * 80 + '\n\n').join(restricted) + '\n',
              encoding='utf-8')
          print(summary)
          PY

      - name: Search native helpers for hidden script execution
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('firefox/js/src')
          allowed = {'.cpp', '.h', '.inl', '.yaml', '.py', '.js', '.msg'}
          files = [p for p in root.rglob('*') if p.is_file() and (p.suffix in allowed or p.name.endswith('-inl.h'))]

          groups = {
              'effect-comments.txt': (
                  re.compile(r'can run (?:JavaScript|JS)|may run (?:JavaScript|JS)|runs? (?:JavaScript|JS)|arbitrary (?:JavaScript|JS)|invoke(?:s|d)? (?:a )?(?:getter|setter|callback)|side[- ]effects?|re-?entran|user code|scripted getter|proxy trap', re.I),
                  ('jit/', 'wasm/', 'vm/', 'builtin/'), 3, 16000),
              'jit-wasm-script-entrypoints.txt': (
                  re.compile(r'JS_GetProperty|GetProperty\(|GetPropertyPure|GetOwnProperty|Call\(|CallGetter|Invoke\(|ToPrimitive|ToString\(|ToNumber\(|IterableToArray|PromiseResolve\(|GetIterator|NewPromiseObject|Debugger'),
                  ('jit/', 'wasm/'), 4, 22000),
              'custom-mir-effects.txt': (
                  re.compile(r'possiblyCalls\(.*override|getAliasSet\(.*override|wasmCallAliasSet|AliasSet::(?:None|Load|Store)'),
                  ('jit/',), 5, 22000),
              'high-risk-notes.txt': (
                  re.compile(r'TODO|FIXME|HACK|XXX|unsafe|unchecked|assum(?:e|ing|ption)', re.I),
                  ('jit/', 'wasm/'), 3, 18000),
              'native-script-entrypoints.txt': (
                  re.compile(r'AutoRealm|CallGetter|CallSetter|Call\(|Invoke\(|JS_GetProperty|GetProperty\(|GetOwnProperty|GetIterator|IterableToArray|PromiseResolve\('),
                  ('jit/', 'wasm/'), 6, 24000),
          }

          def scan(pattern, prefixes, context, cap):
              out = []
              count = 0
              for path in files:
                  rel = path.relative_to(root).as_posix()
                  if not any(rel.startswith(prefix) for prefix in prefixes):
                      continue
                  try:
                      lines = path.read_text(encoding='utf-8', errors='replace').splitlines()
                  except OSError:
                      continue
                  hits = [i for i, line in enumerate(lines) if pattern.search(line)]
                  if not hits:
                      continue
                  merged = []
                  for i in hits:
                      lo, hi = max(0, i-context), min(len(lines), i+context+1)
                      if merged and lo <= merged[-1][1]:
                          merged[-1] = (merged[-1][0], max(merged[-1][1], hi))
                      else:
                          merged.append((lo, hi))
                  for lo, hi in merged:
                      out.append(f'===== {rel}:{lo+1}-{hi} =====')
                      for n in range(lo, hi):
                          out.append(f'{n+1}: {lines[n]}')
                          count += 1
                          if count >= cap:
                              out.append('=== OUTPUT CAPPED ===')
                              return '\n'.join(out) + '\n'
                      out.append('')
              return '\n'.join(out) + '\n'

          for name, spec in groups.items():
              Path(name).write_text(scan(*spec), encoding='utf-8')

          builtin = Path('firefox/js/src/wasm/WasmBuiltinModule.yaml').read_text(encoding='utf-8', errors='replace').splitlines()
          selected = []
          for i, line in enumerate(builtin):
              if re.search(r'^- op:|^  entry:|inline_op:|fail_mode:|uses_memory:', line):
                  lo, hi = max(0, i-4), min(len(builtin), i+5)
                  selected.extend(f'{n+1}: {builtin[n]}' for n in range(lo, hi))
                  selected.append('')
          Path('wasm-builtin-inventory.txt').write_text('\n'.join(selected), encoding='utf-8')
          PY

      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-jit-effect-inventory
          path: |
            firefox-revision.txt
            mir-call-summary.tsv
            mir-restricted-call-blocks.txt
            effect-comments.txt
            jit-wasm-script-entrypoints.txt
            custom-mir-effects.txt
            wasm-builtin-inventory.txt
            high-risk-notes.txt
            native-script-entrypoints.txt
          if-no-files-found: warn
