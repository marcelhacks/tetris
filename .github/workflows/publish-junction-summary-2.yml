name: Publish completed junction-only proof summary
on:
  push:
    branches: [runner-probe-20260910]
    paths:
      - .github/workflows/publish-junction-summary-2.yml
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runner-probe-20260910
      - name: Download and publish sanitized summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf proof-out && mkdir proof-out
          gh run download 34455592466 --repo "$GITHUB_REPOSITORY" --name sealed-firefox-e2e-windows --dir proof-out
          test -s proof-out/public-summary.json
          cp proof-out/public-summary.json junction-only-public-summary.json
          cat junction-only-public-summary.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add junction-only-public-summary.json
          git commit -m "Publish completed junction-only proof summary" || exit 0
          git push origin HEAD:runner-probe-20260910
