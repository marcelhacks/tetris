name: Render Firefox proof status PDF

on:
  push:
    branches: [runner-probe-20260910]
    paths:
      - .github/workflows/render-firefox-proof-status-pdf.yml
      - .proof-results/posix-symlink-ssh-summary-v2.json

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runner-probe-20260910
      - run: python -m pip install reportlab
      - name: Render current state
        run: |
          mkdir -p .proof-results
          python - <<'PY'
          import json
          from pathlib import Path
          from reportlab.lib.pagesizes import letter
          from reportlab.pdfgen.canvas import Canvas
          p=Path('.proof-results/posix-symlink-ssh-summary-v2.json')
          d=json.loads(p.read_text()) if p.exists() else {'verdict':'SUMMARY_MISSING'}
          c=Canvas('.proof-results/firefox-proof-status.pdf',pagesize=letter)
          width,height=letter
          y=height-54
          def line(s,size=10):
            global y
            c.setFont('Courier',size)
            for chunk_start in range(0,len(s),92):
              c.drawString(36,y,s[chunk_start:chunk_start+92])
              y-=14
              if y<50:
                c.showPage(); y=height-54
          line('FIREFOX STRICT PROOF STATUS',14)
          line('verdict=' + str(d.get('verdict')),12)
          line('vector=' + str(d.get('cvss_candidate')),11)
          line('run=' + str(d.get('workflow_run_id')))
          line('selection=' + str(d.get('selection_method')))
          line('browser_error=' + str(d.get('browser_error')))
          line('webdriver_error=' + str(d.get('webdriver_selection_error')))
          line('native_window=' + str(d.get('native_picker_active_window')))
          line('native_error=' + str(d.get('native_picker_automation_error')))
          line('confirmation=' + str(d.get('confirmation_accepted')))
          line('page_state=' + json.dumps(d.get('page_state'),sort_keys=True))
          line('conditions:')
          for k,v in (d.get('conditions') or {}).items(): line(f'{k}={v}')
          c.save()
          PY
      - name: Commit PDF
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .proof-results/firefox-proof-status.pdf
          git commit -m 'Render Firefox strict proof status PDF' || exit 0
          git push origin HEAD:runner-probe-20260910
